name: case-opener

services:
  case-opener-pg:
    image: pgvector/pgvector:pg17
    container_name: case-opener-pg
    env_file:
      - ../.dev.env
    environment:
      POSTGRES_DB: ${PG__DB}
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
    ports:
      - "${PG__PORT}:5432"
    volumes:
      - case_opener_pg:/var/lib/postgresql/data
    networks:
      - backend

  case-opener-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: case-opener-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - case-opener-pg
    volumes:
      - case_opener_pgadmin:/var/lib/pgadmin
    networks:
      - backend

volumes:
  case_opener_pg:
    name: docker_compose_case_opener_pg
  case_opener_pgadmin:
    name: docker_compose_case_opener_pgadmin

networks:
  backend:
    driver: bridge
