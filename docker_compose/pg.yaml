name: project-name

services:
  project-name-pg:
    image: pgvector/pgvector:pg17
    container_name: project-name-pg
    env_file:
      - ../.dev.env
    environment:
      POSTGRES_DB: ${PG__DB}
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
    ports:
      - "${PG__PORT}:5432"
    volumes:
      - project_name_pg:/var/lib/postgresql/data
    networks:
      - backend

  project-name-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: project-name-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - project-name-pg
    volumes:
      - project_name_pgadmin:/var/lib/pgadmin
    networks:
      - backend

volumes:
  project_name_pg:
    name: docker_compose_project_name_pg
  project_name_pgadmin:
    name: docker_compose_project_name_pgadmin

networks:
  backend:
    driver: bridge
