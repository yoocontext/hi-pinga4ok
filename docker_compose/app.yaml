name: project-name

services:
  project-name:
    container_name: project-name
    build:
      context: ..
      dockerfile: Dockerfile
    image: project-name
    env_file:
      - ../.dev.env
    environment:
      PG__HOST: project-name-pg
      PG__PORT: "5432"
    ports:
      - "${APP_PORT}:8003"
    command: "./.venv/bin/uvicorn bootstrap.app:create_app --host 0.0.0.0 --port 8003 --factory"
    networks:
      - backend

networks:
  backend:
    driver: bridge
